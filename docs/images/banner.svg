    <path d="M44 62l26 26 26-26" fill="none" stroke="#141413" stroke-width="14" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M34 106h72" stroke="#141413" stroke-width="14" stroke-linecap="round"/>
  </g>

  <!-- Título -->
  <text x="275" y="140" font-family="Segoe UI, Inter, Helvetica, Arial, sans-serif" font-size="72" font-weight="800" fill="#ffffff">Open<tspan fill="url(#accent)">IDM</tspan></text>
  <text x="279" y="185" font-family="Segoe UI, Inter, Helvetica, Arial, sans-serif" font-size="26" fill="#d8d4cc">Gerenciador de Downloads open source com segmentação dinâmica</text>

