name: ✨ Sugerir funcionalidade / Feature Request
description: Ideia de melhoria ou novo recurso / Suggest an improvement or new feature
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: Qual problema isso resolve? / What problem does this solve?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Como você imagina a solução? / Proposed Solution
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternativas consideradas / Alternatives Considered
